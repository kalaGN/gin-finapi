name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: go mod download && go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '\.pb\.go$'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Check standalone Redis initializer
        run: |
          go vet cmd/init_redis.go
          go test -race cmd/init_redis.go cmd/init_redis_test.go
          go build -o /tmp/gin-finapi-init-redis cmd/init_redis.go
